[project]
name = "unector"
version = "0.1.0"
description = "Unector Discord community bot"
requires-python = ">=3.12,<3.13"
dependencies = [
  "discord.py==2.7.1",
  "aiosqlite>=0.21,<1.0",
  "aiohttp>=3.11,<4.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1.0", "pytest>=8.3,<9.0", "pytest-asyncio>=0.26,<1.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["unector*"]
